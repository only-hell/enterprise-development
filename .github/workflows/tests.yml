name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: VetClinic

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore VetClinic.slnx

      - name: Build
        run: dotnet build VetClinic.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test --solution VetClinic.slnx --no-build --configuration Release
